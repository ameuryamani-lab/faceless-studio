<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Promo</title>
<!--
  Faceless Studio promo: a video of at most one minute, in motion design, showing the vitrine making and posting the videos.
  A frame-driven composition: window.renderFrame(n) draws frame n (30 fps) synchronously,
  so workshop/promo/render.mjs can capture every frame with a headless browser. Numbers come from the URL (?videos=&runs=&tokens=).
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #07040d; font-family: "Segoe UI", Arial, sans-serif; color: #fff; }
  .layer { position: absolute; inset: 0; will-change: transform, opacity; }
  .bg { position: absolute; inset: -10%; background-size: cover; background-position: center; }
  .shade { position: absolute; inset: 0; background: radial-gradient(70% 55% at 50% 45%, rgba(10,5,20,0.25), rgba(7,4,13,0.92)); }
  .big { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; letter-spacing: -2px; line-height: 0.92; }
  .pink { color: #ff6fae; text-shadow: 0 0 40px rgba(255,111,174,0.8); }
  .violet { color: #c084fc; text-shadow: 0 0 40px rgba(168,85,247,0.8); }
  .chip { position: absolute; padding: 18px 30px; border-radius: 40px; font-weight: 800; font-size: 40px; background: rgba(255,255,255,0.08); border: 3px solid rgba(255,255,255,0.18); white-space: nowrap; }
  .chip.on { background: rgba(34,197,94,0.22); border-color: #22c55e; box-shadow: 0 0 30px rgba(34,197,94,0.6); }
  .live { position: absolute; top: 70px; left: 70px; display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 34px; letter-spacing: 3px; }
  .live i { width: 22px; height: 22px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 18px #ef4444; }
  .card { position: absolute; left: 240px; top: 520px; width: 600px; height: 800px; border-radius: 40px; border: 14px solid #8b8fa3; background-size: cover; background-position: center; overflow: hidden; }
  .state { position: absolute; left: 0; right: 0; top: 1370px; text-align: center; font-weight: 900; font-size: 92px; }
  .bar { position: absolute; left: 0; bottom: 0; height: 22px; background: #8b8fa3; }
  .pill { position: absolute; top: 1520px; padding: 22px 34px; border-radius: 24px; font-weight: 900; font-size: 44px; color: #0b0712; }
  .step { position: absolute; top: 300px; width: 104px; height: 104px; border-radius: 26px; display: grid; place-items: center; font-size: 56px; background: rgba(255,255,255,0.07); }
  .flash { position: absolute; inset: 0; background: #fff; pointer-events: none; }
  .title { position: absolute; left: 60px; right: 60px; bottom: 260px; text-align: center; font-weight: 900; font-size: 74px; line-height: 1.05; text-shadow: 0 6px 30px rgba(0,0,0,0.9); }
  .stat { position: absolute; left: 90px; right: 90px; height: 250px; border-radius: 36px; background: rgba(255,255,255,0.06); border: 3px solid rgba(255,255,255,0.12); }
  .stat b { position: absolute; left: 50px; top: 46px; font-size: 40px; letter-spacing: 3px; color: #b9a9d6; font-weight: 800; }
  .stat span { position: absolute; left: 50px; bottom: 30px; font-size: 120px; font-weight: 900; }
  .stat em { position: absolute; left: 0; bottom: 0; height: 12px; border-radius: 0 6px 6px 0; }
  .tile { position: absolute; width: 300px; height: 533px; border-radius: 26px; background-size: cover; background-position: center; border: 8px solid #22c55e; }
</style>
</head>
<body>
<div id="root"></div>
<script src="promo.js"></script>
</body>
</html>
